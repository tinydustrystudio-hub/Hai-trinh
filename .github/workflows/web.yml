name: Web

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Test và xuất bản web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/setup-godot
        with:
          templates: web_nothreads_release.zip

      - name: Nhập tài nguyên
        run: |
          godot --headless --import 2>&1 | tee import.log
          if grep -qE '^(SCRIPT )?ERROR' import.log; then
            echo "::error::Nhập tài nguyên có lỗi, xem log ở trên."
            exit 1
          fi

      - name: Chạy test GUT
        run: godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests -gexit

      - name: Xuất bản web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.wasm
          du -sh build/web

      - name: Đính bản web làm artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hai-trinh-web
          path: build/web

      - name: Chuẩn bị cho GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Đưa lên GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
