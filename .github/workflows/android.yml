name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Xuất APK debug
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;35.0.1 platforms;android-35

      - uses: ./.github/actions/setup-godot
        with:
          templates: android_debug.apk

      - name: Trỏ Godot tới Android SDK và JDK
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT

      - name: Tạo keystore debug
        run: |
          keystore="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -v -keystore "$keystore" \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Nhập tài nguyên
        run: godot --headless --import

      - name: Xuất APK
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" build/hai-trinh.apk
          test -f build/hai-trinh.apk
          du -h build/hai-trinh.apk

      - name: Đính APK làm artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: hai-trinh-apk
          path: build/hai-trinh.apk

      - name: Đưa lên bản phát hành "nightly"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Bản dựng tự động từ main, commit ${GITHUB_SHA::7}."
          if gh release view nightly > /dev/null 2>&1; then
            git tag -f nightly "$GITHUB_SHA"
            git push -f origin refs/tags/nightly
            gh release edit nightly --notes "$notes"
          else
            gh release create nightly --prerelease --title "Nightly" --notes "$notes" --target "$GITHUB_SHA"
          fi
          gh release upload nightly build/hai-trinh.apk --clobber
